[project]
name = "bugbounty-pipeline"
version = "0.1.0"
description = "Pipeline automatizado y orquestado para bug bounty con gates de seguridad"
readme = "orchestrator/CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.2",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
]

[project.scripts]
bbp = "bbpipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbpipeline"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]
